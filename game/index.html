<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Solmar — Streets of the Sun: a top-down open-world crime game. Steal cars, outrun the Solmar PD, run Rico's jobs and take back the city.">
<title>Solmar — Streets of the Sun</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #11141b; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Solmar, Streets of the Sun: an open-world crime game. Drive, steal cars, outrun the police and run Rico's jobs."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
